# repos.yaml — the organism's body map: the single source of repo IDENTITY.
#
# Identity plus explicit generated-adapter rollout: GitHub home, category,
# one-line role, and which reviewed Codex hook adapters a repo installs.
# Per-organ POLICY stays with the organ that owns it — what Heart polls/gates lives in
# PyAutoHeart/config/repos.yaml; what pre_build formats/generates lives in
# PyAutoHands/pre_build.sh. Those files must agree with this one on identity;
# `scripts/repos_sync.py --check` enforces it (including against the actual
# `git remote` of every local checkout).
#
# After editing this file:
#
#   python3 PyAutoMind/scripts/repos_sync.py --write
#
# regenerates the routing table in <workspace-root>/AGENTS.md and the owner
# map in PyAutoBrain/skills/WORKFLOW.md, then re-runs the drift checks.
#
# Categories with `collapse: true` render as ONE row (label + role) in the
# routing table, to keep it token-lean; other categories render one row per
# repo using the repo's own `role:`.

categories:
  organ: {}
  library: {}
  workspace:
    collapse: true
    label: "autofit/autogalaxy/autolens_workspace"
    role: "User-facing example scripts, tutorials, configs for each library."
  workspace_test:
    collapse: true
    label: "\\*_workspace_test"
    role: "Regression, smoke and parity scripts (code-heavy, doc-light)."
  workspace_developer:
    collapse: true
    label: "\\*_workspace_developer"
    role: "Developer / profiling / experiment scripts (code-heavy, doc-light)."
  howto:
    collapse: true
    label: "HowToFit / HowToGalaxy / HowToLens"
    role: "Narrative teaching tutorials."
  assistant:
    collapse: true
    label: "autocti / autofit / autogalaxy / autolens / euclid _assistant"
    role: "Science-assistant workspaces (see lensing pointer below)."
  pipeline: {}
  project: {}

# `unmapped_checkouts:` names directories at the workspace root (a bare name) or
# inside a family directory (a root-relative `family/name` path) that ARE git
# checkouts but are deliberately NOT body-map repos. Identity, like everything
# else here: it says "this one is not ours", which is the only way the
# disk -> manifest half of `repos_sync.py --check` can tell a deliberate
# neighbour from a checkout someone forgot to declare. Keep it short — a repo
# that belongs to the organism belongs under `repos:`, not here.
unmapped_checkouts:
  - .github              # PyAutoLabs/.github — the org profile repo, not an organism repo
  - lens/COWLS_COSMOS_Web_Lens_Survey  # Jammy2211/COWLS_COSMOS_Web_Lens_Survey — a personal data-release checkout, not an organism repo

# Bootstrap-only rollout coordinated with active consumer tasks on 2026-09-18.
# Their runner bodies and task branches remain untouched by propagation.
smoke_bootstrap_rollout: true

# `board_owner: true` identifies owners of organism presentation boards.
# Every registered repo receives shared-standards discovery; only these owners
# receive board component guidance. This is independent of hook/filing scope.
repos:
  # --- organs -----------------------------------------------------------
  # `public_role` is the curated copy shown in the public front-door organ
  # tables (org profile + PyAutoScientist READMEs, generated by repos_sync);
  # it falls back to `role` when absent. `front_door: true` is the mechanism for
  # adding a *non-organ* repo to that public set without making it a
  # category:organ — the internal organism map (system_map) stays strict. No
  # repo currently uses it (Nerves/PyAutoNerves, its former user, is now a full
  # organ); it is kept for a future library that belongs on the public front
  # door without being an organ.
  #
  # `package:` names the import/PyPI package a repo ships, and is absent where
  # it ships none. It is identity, not policy: it is the OTHER name the repo is
  # known by, and prompts use it far more than the repo name (`@autofit`, not
  # `@PyAutoFit`). PyAutoBrain derives its canonical routing key from it —
  # the package name where a repo ships one, the repo name where it does not —
  # so both spellings of a repo reach the same key instead of splitting across
  # two (PyAutoBrain#287, the fourth instance of that defect). Adding a package
  # here is what makes a new repo's spellings join automatically; omitting one a
  # repo really ships re-opens the split.
  #
  # `session_hook: false` opts a repo OUT of the generated SessionStart hook
  # (`policy/session_start_hook.sh`, installed by `--write` into every other
  # checked-out repo). It is a manifest exclusion, not drift: the repo that
  # carries it lives in the personal `Jammy2211/` namespace, is excluded
  # from the org-wide dev sweeps by category, and never had a `.claude/`. Every
  # in-scope repo keeps the hook — a library or workspace opened alone in a web
  # session needs Python 3.12 exactly like an organ (PyAutoMind#369).
  #
  # `filing_block: false` opts a repo OUT of the generated where-to-file
  # AGENTS.md block (`policy/where_to_file.md`): it is neither written nor
  # reported there. A recorded exclusion, not drift (PyAutoMind#442).
  #
  # `codex_hooks:` is the explicit, opt-in rollout manifest for generated
  # `.codex/hooks.json`. Unlike the universal Claude SessionStart bootstrap,
  # Codex registrations are added only after their existing hook implementation
  # has been verified against Codex's PreToolUse wire format. An absent key is
  # intentionally out of scope, not drift.
  PyAutoBrain:
    board_owner: true
    path: organs/PyAutoBrain
    github: PyAutoLabs/PyAutoBrain
    category: organ
    organ: Brain
    role: "Reasoning/orchestration layer; how work is decomposed and routed; the specialist agents."
    public_role: "Works out *how*: classifies, plans and routes work through specialist reasoning and coding agents."
    codex_hooks: [mind-commit-guard, end-at-deliverable]
  PyAutoMind:
    board_owner: true
    path: organs/PyAutoMind
    github: PyAutoLabs/PyAutoMind
    category: organ
    organ: Mind
    role: "Intent, goals, priorities, workflow state; every task starts as a markdown prompt here."
    public_role: "Captures intent: every piece of work begins as a plain-English description of *what* should change and is tracked from the initial idea to its completed implementation."
    codex_hooks: [end-at-deliverable]
  PyAutoCortex:
    board_owner: true
    path: organs/PyAutoCortex
    github: PyAutoLabs/PyAutoCortex
    category: organ
    organ: Cortex
    role: "The Cortex — what is true in the science: the body map (`projects.yaml`) and one ledger per science project (runs, results, learnings, where to pick up); the science mirror of the Mind."
    public_role: "Holds the science body map and one ledger per science project — the runs on the cluster and a dated log of what was set off, seen and learned — so a project is picked up where it was left, apart from software development."
  PyAutoMemory:
    board_owner: true
    path: organs/PyAutoMemory
    github: PyAutoLabs/PyAutoMemory
    category: organ
    organ: Memory
    role: "Long-term scientific/software/project knowledge (see science pointer below)."
    public_role: "Provides long-term scientific knowledge through cross-linked literature wikis, concepts and verifiable citations."
  PyAutoEyes:
    board_owner: true
    path: organs/PyAutoEyes
    github: PyAutoLabs/PyAutoEyes
    category: organ
    organ: Eyes
    role: "The Eyes — cross-project visualization dashboard over the `<lib>_visualization` repos: their registry, the `gallery/viz_manifest.yaml` read contract and the Pages board linking their PNGs. Renders and copies nothing, never judges figures (the Brain's Eyes conductor does) and never edits plot code."
    public_role: "The dashboard of every figure the PyAuto libraries draw: it gathers each library's rendered gallery on realistic data into one board, so what the software shows can be seen, judged and improved in one place."
  PyAutoEars:
    board_owner: true
    path: organs/PyAutoEars
    github: PyAutoLabs/PyAutoEars
    category: organ
    organ: Ears
    role: "The Ears — community listening: read-only public conversation collection, the versioned community snapshot contract, coverage receipts and the dashboard. GitHub stays authoritative; Brain's Community conductor judges and drafts replies; never posts, labels, files issues or exports transcripts."
    public_role: "Listens to public community conversations and feedback, showing who may need attention and where listening coverage is incomplete; the Community workflow helps you decide how to respond."
  PyAutoHeart:
    board_owner: true
    path: organs/PyAutoHeart
    github: PyAutoLabs/PyAutoHeart
    category: organ
    organ: Heart
    role: "Health/readiness — the authoritative \"is it safe to release?\" verdict."
    public_role: "Monitors repository health and supplies the authoritative GREEN/YELLOW/RED release-readiness verdict."
  PyAutoHands:
    board_owner: true
    path: organs/PyAutoHands
    github: PyAutoLabs/PyAutoHands
    category: organ
    organ: Hands
    role: "Packaging, tagging, notebook generation, PyPI release execution."
    public_role: "Executes builds and releases: packages libraries, generates notebooks, creates tags and publishes releases to PyPI."
  PyAutoPulse:
    board_owner: true
    path: organs/PyAutoPulse
    github: PyAutoLabs/PyAutoPulse
    category: organ
    organ: Pulse
    role: "The Pulse — cross-project profiling dashboard over the `<lib>_profiling` repos: campaign intent, instance registry, the versioned `profiling-summary` read contract, ingest receipts and the Pages board. Validates the contract only; never judges, scores or issues verdicts (the Brain's profiling conductor judges)."
    public_role: "The dashboard of how fast the PyAuto libraries run: it gathers each library's profiling results into one board, so run times and how they change across releases can be seen in one place."
  PyAutoInsight:
    board_owner: true
    path: organs/PyAutoInsight
    github: PyAutoLabs/PyAutoInsight
    category: organ
    organ: Insight
    role: "Inference campaign intent, the cross-project inference instance registry, the versioned `inference-summary` read contract, ingest receipts and the evidence dashboard. Projects execute, Cortex records the science, Mind owns task state; never infers scientific acceptance or submits compute."
    public_role: "Coordinates inference campaigns and their tasks in one place, showing results, diagnostics, provenance and missing evidence across projects while keeping scientific conclusions with the human and Cortex."
  PyAutoDNA:
    board_owner: true
    path: organs/PyAutoDNA
    github: PyAutoLabs/PyAutoDNA
    category: organ
    organ: DNA
    role: "Software-stack specifications, environment inventory receipts, support rationale, upgrade campaigns and adoption history. Brain coordinates, Heart validates readiness, Hands releases, Nerves enforces runtime compatibility; collection never upgrades environments."
    public_role: "Records software-stack specifications, tracks what local, RAL and CI environments run, and coordinates validated upgrades with compatibility evidence and rollback history."
  PyAutoNerves:
    board_owner: true
    path: organs/PyAutoNerves
    github: PyAutoLabs/PyAutoNerves
    package: autonerves
    category: organ
    organ: Nerves
    role: "The Nerves — the configuration/serialization layer connecting workspace conventions to libraries (layered config, version handshake, test_mode), delivered as the `autonerves` package."
    public_role: "Provides the configuration and serialization layer connecting shared conventions across the scientific libraries and workspaces."
  PyAutoGut:
    board_owner: true
    path: organs/PyAutoGut
    github: PyAutoLabs/PyAutoGut
    category: organ
    organ: Gut
    role: "Lifecycle of condemned self-material (stale branches, stashes, dead code/tests): held as recoverable git refs through a transit window, voided on a sweep. The storage mirror of Memory."
    public_role: "Holds stale branches, dead code and other condemned material as recoverable Git references before it is permanently removed."
  # --- scientific libraries ----------------------------------------------
  PyAutoFit:
    path: fit/PyAutoFit
    github: PyAutoLabs/PyAutoFit
    package: autofit
    category: library
    role: "Model-fitting / non-linear search / aggregator library."
  PyAutoArray:
    path: array/PyAutoArray
    github: PyAutoLabs/PyAutoArray
    package: autoarray
    category: library
    role: "Data structures (arrays, grids, masks), inversions, interferometry."
  PyAutoGalaxy:
    path: galaxy/PyAutoGalaxy
    github: PyAutoLabs/PyAutoGalaxy
    package: autogalaxy
    category: library
    role: "Galaxy light/mass profiles and galaxy modelling."
  PyAutoLens:
    path: lens/PyAutoLens
    github: PyAutoLabs/PyAutoLens
    package: autolens
    category: library
    role: "Strong-lensing modelling built on the libraries above."
  PyAutoReduce:
    path: reduce/PyAutoReduce
    github: PyAutoLabs/PyAutoReduce
    package: autoreduce
    category: library
    role: "Data reduction of HST (and future JWST/other) imaging into modeling-ready datasets for PyAutoLens/PyAutoGalaxy."
  PyAutoCTI:
    path: cti/PyAutoCTI
    github: PyAutoLabs/PyAutoCTI
    package: autocti
    category: library
    role: "Charge Transfer Inefficiency (CTI) calibration and modelling for CCD imaging (arctic clocking; Euclid VIS heritage)."

