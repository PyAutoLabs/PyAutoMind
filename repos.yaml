# repos.yaml — the organism's body map: the single source of repo IDENTITY.
#
# Identity only: GitHub home, category, one-line role. Per-organ POLICY stays
# with the organ that owns it — what Heart polls/gates lives in
# PyAutoHeart/config/repos.yaml; what pre_build formats/generates lives in
# PyAutoHands/pre_build.sh. Those files must agree with this one on identity;
# `scripts/repos_sync.py --check` enforces it (including against the actual
# `git remote` of every local checkout).
#
# After editing this file:
#
#   python3 PyAutoMind/scripts/repos_sync.py --write
#
# regenerates the routing table in <workspace-root>/AGENTS.md and the owner
# map in PyAutoBrain/skills/WORKFLOW.md, then re-runs the drift checks.
#
# Categories with `collapse: true` render as ONE row (label + role) in the
# routing table, to keep it token-lean; other categories render one row per
# repo using the repo's own `role:`.

categories:
  organ: {}
  library: {}
  workspace:
    collapse: true
    label: "autofit/autogalaxy/autolens_workspace"
    role: "User-facing example scripts, tutorials, configs for each library."
  workspace_test:
    collapse: true
    label: "\\*_workspace_test"
    role: "Regression, smoke and parity scripts (code-heavy, doc-light)."
  workspace_developer:
    collapse: true
    label: "\\*_workspace_developer"
    role: "Developer / profiling / experiment scripts (code-heavy, doc-light)."
  howto:
    collapse: true
    label: "HowToFit / HowToGalaxy / HowToLens"
    role: "Narrative teaching tutorials."
  assistant:
    collapse: true
    label: "autocti / autofit / autogalaxy / autolens / euclid _assistant"
    role: "Science-assistant workspaces (see lensing pointer below)."
  pipeline: {}
  project: {}
  admin: {}

repos:
  # --- organs -----------------------------------------------------------
  # `public_role` is the curated copy shown in the public front-door organ
  # tables (org profile + PyAutoScientist READMEs, generated by repos_sync);
  # it falls back to `role` when absent. `front_door: true` is the mechanism for
  # adding a *non-organ* repo to that public set without making it a
  # category:organ — the internal organism map (system_map) stays strict. No
  # repo currently uses it (Nerves/PyAutoNerves, its former user, is now a full
  # organ); it is kept for a future library that belongs on the public front
  # door without being an organ.
  #
  # `package:` names the import/PyPI package a repo ships, and is absent where
  # it ships none. It is identity, not policy: it is the OTHER name the repo is
  # known by, and prompts use it far more than the repo name (`@autofit`, not
  # `@PyAutoFit`). PyAutoBrain derives its canonical routing key from it —
  # the package name where a repo ships one, the repo name where it does not —
  # so both spellings of a repo reach the same key instead of splitting across
  # two (PyAutoBrain#287, the fourth instance of that defect). Adding a package
  # here is what makes a new repo's spellings join automatically; omitting one a
  # repo really ships re-opens the split.
  #
  # `session_hook: false` opts a repo OUT of the generated SessionStart hook
  # (`policy/session_start_hook.sh`, installed by `--write` into every other
  # checked-out repo). It is a manifest exclusion, not drift: the two repos
  # that carry it live in the personal `Jammy2211/` namespace, are excluded
  # from the org-wide dev sweeps by category, and never had a `.claude/`. Every
  # in-scope repo keeps the hook — a library or workspace opened alone in a web
  # session needs Python 3.12 exactly like an organ (PyAutoMind#369).
  PyAutoBrain:
    github: PyAutoLabs/PyAutoBrain
    category: organ
    organ: Brain
    role: "Reasoning/orchestration layer; how work is decomposed and routed; the specialist agents."
    public_role: "Works out *how*: classifies, plans and routes work through specialist reasoning and coding agents."
  PyAutoMind:
    github: PyAutoLabs/PyAutoMind
    category: organ
    organ: Mind
    role: "Intent, goals, priorities, workflow state; every task starts as a markdown prompt here."
    public_role: "Captures intent: every piece of work begins as a plain-English description of *what* should change and is tracked from the initial idea to its completed implementation."
  PyAutoCortex:
    github: PyAutoLabs/PyAutoCortex
    category: organ
    organ: Cortex
    role: "The Cortex — where the organism learns what is true: the science body map (`projects.yaml`) and the rulings of record for every science run; the science mirror of the Mind (runs and rulings, not prompts and PRs)."
    public_role: "Holds the science body map and the rulings of record for every science run, so experiments, their gates and their verdicts live apart from software development."
  PyAutoMemory:
    github: PyAutoLabs/PyAutoMemory
    category: organ
    organ: Memory
    role: "Long-term scientific/software/project knowledge (see science pointer below)."
    public_role: "Provides long-term scientific knowledge through cross-linked literature wikis, concepts and verifiable citations."
  PyAutoHeart:
    github: PyAutoLabs/PyAutoHeart
    category: organ
    organ: Heart
    role: "Health/readiness — the authoritative \"is it safe to release?\" verdict."
    public_role: "Monitors repository health and supplies the authoritative GREEN/YELLOW/RED release-readiness verdict."
  PyAutoHands:
    github: PyAutoLabs/PyAutoHands
    category: organ
    organ: Hands
    role: "Packaging, tagging, notebook generation, PyPI release execution."
    public_role: "Executes builds and releases: packages libraries, generates notebooks, creates tags and publishes releases to PyPI."
  PyAutoNerves:
    github: PyAutoLabs/PyAutoNerves
    package: autonerves
    category: organ
    organ: Nerves
    role: "The Nerves — the configuration/serialization layer connecting workspace conventions to libraries (layered config, version handshake, test_mode), delivered as the `autonerves` package."
    public_role: "Provides the configuration and serialization layer connecting shared conventions across the scientific libraries and workspaces."
  PyAutoGut:
    github: PyAutoLabs/PyAutoGut
    category: organ
    organ: Gut
    role: "Owns the lifecycle of condemned self-material (stale branches, stashes, dead code/tests): holds it as durable, recoverable git refs through a transit window and voids it on a sweep. The storage mirror of Memory (retention vs release)."
    public_role: "Holds stale branches, dead code and other condemned material as recoverable Git references before it is permanently removed."
  # --- scientific libraries ----------------------------------------------
  PyAutoFit:
    github: PyAutoLabs/PyAutoFit
    package: autofit
    category: library
    role: "Model-fitting / non-linear search / aggregator library."
  PyAutoArray:
    github: PyAutoLabs/PyAutoArray
    package: autoarray
    category: library
    role: "Data structures (arrays, grids, masks), inversions, interferometry."
  PyAutoGalaxy:
    github: PyAutoLabs/PyAutoGalaxy
    package: autogalaxy
    category: library
    role: "Galaxy light/mass profiles and galaxy modelling."
  PyAutoLens:
    github: PyAutoLabs/PyAutoLens
    package: autolens
    category: library
    role: "Strong-lensing modelling built on the libraries above."
  PyAutoReduce:
    github: PyAutoLabs/PyAutoReduce
    package: autoreduce
    category: library
    role: "Data reduction of HST (and future JWST/other) imaging into modeling-ready datasets for PyAutoLens/PyAutoGalaxy."
  PyAutoCTI:
    github: PyAutoLabs/PyAutoCTI
    package: autocti
    category: library
    role: "Charge Transfer Inefficiency (CTI) calibration and modelling for CCD imaging (arctic clocking; Euclid VIS heritage)."

  # --- workspaces ---------------------------------------------------------
  autofit_workspace:
    github: PyAutoLabs/autofit_workspace
    category: workspace
  autogalaxy_workspace:
    github: PyAutoLabs/autogalaxy_workspace
    category: workspace
  autolens_workspace:
    github: PyAutoLabs/autolens_workspace
    category: workspace
  autocti_workspace:
    github: PyAutoLabs/autocti_workspace
    category: workspace
  autoreduce_workspace:
    github: PyAutoLabs/autoreduce_workspace
    category: workspace
  autofit_workspace_test:
    github: PyAutoLabs/autofit_workspace_test
    category: workspace_test
  autogalaxy_workspace_test:
    github: PyAutoLabs/autogalaxy_workspace_test
    category: workspace_test
  autolens_workspace_test:
    github: PyAutoLabs/autolens_workspace_test
    category: workspace_test
  autocti_workspace_test:
    github: PyAutoLabs/autocti_workspace_test
    category: workspace_test
  autofit_workspace_developer:
    github: PyAutoLabs/autofit_workspace_developer
    category: workspace_developer
  autolens_workspace_developer:
    github: PyAutoLabs/autolens_workspace_developer
    category: workspace_developer

  # --- tutorials ----------------------------------------------------------
  HowToFit:
    github: PyAutoLabs/HowToFit
    category: howto
  HowToGalaxy:
    github: PyAutoLabs/HowToGalaxy
    category: howto
  HowToLens:
    github: PyAutoLabs/HowToLens
    category: howto

  # --- assistants / pipelines / projects ----------------------------------
  autocti_assistant:
    github: PyAutoLabs/autocti_assistant
    category: assistant
  autofit_assistant:
    github: PyAutoLabs/autofit_assistant
    category: assistant
  autogalaxy_assistant:
    github: PyAutoLabs/autogalaxy_assistant
    category: assistant
  autolens_assistant:
    github: PyAutoLabs/autolens_assistant
    category: assistant
  euclid_assistant:
    github: Jammy2211/euclid_assistant
    category: assistant
    session_hook: false
  euclid_strong_lens_modeling_pipeline:
    github: PyAutoLabs/euclid_strong_lens_modeling_pipeline
    category: pipeline
    role: "Euclid pipeline glue (library/pipeline changes go here, not z_projects/euclid)."
  autolens_profiling:
    github: PyAutoLabs/autolens_profiling
    category: project
    role: "JAX likelihood-profiling runs and results."

  PyAutoScientist:
    github: PyAutoLabs/PyAutoScientist
    category: project
    role: "The umbrella landing repo \u2014 docs + links presenting the organism; RTD source currently lives in PyAutoBrain/docs/."
  pyautolabs.github.io:
    github: PyAutoLabs/pyautolabs.github.io
    category: project
    role: "Public front door \u2014 static docs hub served at pyautolabs.github.io (GitHub Pages)."

  # --- admin ---------------------------------------------------------------
  admin_jammy:
    github: Jammy2211/admin_jammy
    category: admin
    role: "Local tooling, worktree helpers, some skills."
    session_hook: false
