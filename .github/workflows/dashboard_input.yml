name: Dashboard Input

# The write side of the published dashboard (PyAutoMind#565, design C). A ★
# tap or a Goals edit on dashboard.html opens ONE issue here, then labels it
# `dashboard-input`, with a fine-grained token of a dedicated machine account
# holding Issues permission on this repo and nothing else. The trigger is the
# LABEL event, not `opened`: GitHub silently drops labels set at creation by
# anyone without push access, and the machine account has only Triage. This workflow — not the browser — validates it,
# writes queue.md or goals.md, commits as the bot, and closes the issue with a
# one-line result the page reads back. Reference: policy/github_tokens.md
# "The dashboard input token".
#
# Why an issue and not workflow_dispatch: an `issues` event always runs the
# workflow file on the DEFAULT branch, so the code that handles the input is
# never chosen by the caller. A dispatch token can run any workflow at any
# ref, including old branches' unhardened copies.
#
# SECURITY. The issue body is attacker-controlled (a leaked token can open
# any issue), so:
#   - the job runs only when the `dashboard-input` label is added, which
#     takes at least Triage on this repo; the script also requires the issue
#     to be open and unlocked and both its opener and the labeller to be the
#     machine account;
#   - scripts/dashboard_input.py reads the event JSON itself (no issue text
#     passes through a shell or an expression), refuses any author but
#     vars.DASHBOARD_INPUT_LOGIN — a dedicated machine account, refused if it
#     equals vars.HUMAN_LOGIN — refuses anything but a real draft/ or
#     active/ prompt ref or at most 10 short plain goals, and refuses a write
#     that adds `lifecycle.py check` drift;
#   - the guard step refuses a tree in which anything but queue.md or
#     goals.md changed, and only those two paths are ever staged.
#
# RATE. One issue per run; runs are serialised by the concurrency group. A
# group keeps one pending run and cancels older pending ones, so a run first
# closes any OLDER open dashboard-input issue as superseded (its run was
# dropped; the page reverts and says "tap again"). The page itself keeps one
# issue in flight and coalesces taps behind it, so one device never trips this.
# An issue that changes nothing is closed "no change" with no commit. Every
# input issue is closed AND locked. GitHub cannot be made to refuse issue
# creation, so past 30 inputs in an hour (GitHub search) each new one is
# refused unprocessed and locked as spam; each still costs one short run.

on:
  issues:
    types: [labeled]

concurrency:
  group: dashboard-input
  cancel-in-progress: false

# contents: write → the bot commit to main. issues: write → the result comment
# and the close. actions: write → dispatch dashboard_refresh.yml afterwards: a
# GITHUB_TOKEN push triggers no workflow, so the page would not re-render.
permissions:
  contents: write
  issues: write
  actions: write

jobs:
  apply:
    if: >-
      github.repository == 'PyAutoLabs/PyAutoMind'
      && github.event.label.name == 'dashboard-input'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Close older inputs whose runs were dropped
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --label dashboard-input \
            --state open --limit 50 --json number --jq '.[].number' |
          while read -r n; do
            [[ "$n" =~ ^[0-9]+$ ]] || continue
            if [ "$n" -lt "$ISSUE_NUMBER" ]; then
              gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body \
                "dashboard-input: superseded — not applied (a newer input's run replaced this one's); tap again"
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason "not planned"
              gh issue lock "$n" --repo "$GITHUB_REPOSITORY" --reason resolved \
                || echo "::warning::could not lock #$n"
            fi
          done

      - name: Validate, apply, commit
        id: apply
        env:
          DASHBOARD_INPUT_LOGIN: ${{ vars.DASHBOARD_INPUT_LOGIN }}
          HUMAN_LOGIN: ${{ vars.HUMAN_LOGIN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="$RUNNER_TEMP/dashboard_commit_msg.txt"
          result="$RUNNER_TEMP/dashboard_result.txt"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD
            rm -f "$msg"
            # Exit 1 is a refusal: the result line says why, the step
            # summary too, and nothing is written.
            if ! python3 scripts/dashboard_input.py apply --rate-check \
                --event "$GITHUB_EVENT_PATH" --message-file "$msg" --result-file "$result"; then
              exit 0
            fi
            if [ ! -s "$msg" ]; then
              echo "nothing to commit (already so)"
              exit 0
            fi
            git add -- queue.md goals.md
            staged="$(git diff --cached --name-only)"
            if ! python3 scripts/dashboard_input.py guard \
                || printf '%s\n' "$staged" | grep -qvxE 'queue\.md|goals\.md'; then
              echo "::error title=Dashboard input refused::a path other than queue.md or goals.md changed"
              echo "dashboard-input: refused — a path other than queue.md or goals.md changed" > "$result"
              echo "outcome=refused" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --quiet -F "$msg"
            if git push --quiet origin HEAD:main; then
              sha="$(git rev-parse --short HEAD)"
              printf '%s (commit %s)\n' "$(head -n 1 "$result")" "$sha" > "$result"
              echo "Committed \`$sha\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — re-applying on the new tip of main"
          done
          echo "dashboard-input: refused — main moved under five attempts in a row; tap again" > "$result"
          echo "outcome=refused" >> "$GITHUB_OUTPUT"

      - name: Answer, close and lock the issue
        if: always()
        env:
          LOCK_REASON: ${{ steps.apply.outputs.lock }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/dashboard_result.txt"
          if [ ! -s "$result" ]; then
            echo "dashboard-input: refused — the run failed before it could decide; tap again" > "$result"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$result"
          if grep -q '^dashboard-input: refused' "$result"; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          else
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
          case "${LOCK_REASON:-}" in spam) reason=spam ;; *) reason=resolved ;; esac
          gh issue lock "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "$reason" \
            || echo "::warning::could not lock the issue"

      - name: Re-render the dashboard
        if: steps.apply.outputs.outcome == 'applied'
        run: |
          gh workflow run dashboard_refresh.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::could not dispatch dashboard_refresh.yml — the page catches up at its next trigger"

      - name: Fail a refused input
        if: steps.apply.outputs.outcome == 'refused'
        run: |
          echo "::error title=Dashboard input refused::see the issue's result comment"
          exit 1
